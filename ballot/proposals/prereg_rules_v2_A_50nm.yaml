# ballot/proposals/prereg_rules_v2_A_50nm.yaml
#
# PROPOSED CONFIGURATION — Tier-A ballot variant A_50nm
# NOT RATIFIED. DO NOT USE FOR SWEEP AUTHORIZATION.
#
# This variant proposes:
#   S2 Mechanics: Option A (heterogeneous datum thresholds)
#   S4 Radius: 50 nautical miles
#
# Requires prereg-rules-v2 tag and A+B ratification before execution.

schema_version: "0.3"

# N3 — governing ADR
governing_adr: docs/decisions/0002-episode-preregistration.md

# D1 — global sample period (ratified 2026-08-24)
sample_period:
  sample_start: "2010-01-01"
  sample_end: "2024-12-31"

# D2 — corridor / basin scope
corridors:
  navigation_basins:
    - lower_mississippi
    - middle_mississippi
    - upper_mississippi
    - ohio
    - illinois
    - columbia_snake

