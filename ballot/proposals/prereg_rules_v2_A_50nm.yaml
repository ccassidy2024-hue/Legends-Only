# D4 — keyword policy (unchanged)
keyword_policy:
  terms:
    - closure
    - restriction
    - "draft restriction"
    - lockage
    - "high water"
    - "low water"
    - dredging
    - outage
    - grounding
    - allision
    - breach
  match: whole_word
  case_sensitive: false
  fields:
    - full_text

# D5 — candidate table (unchanged)
candidates:
  table_path: research/episodes/discovery/candidates/candidates.csv
  id_prefix: CAND
  ordering_keys:
    - sweep_id
    - source_reference
  stable_id_key: null

# D6 — capture roots (unchanged)
capture:
  sweeps_subdir: sweeps
  rehome_policy: candidate_keyed_no_move

# D7 — coverage gap policy (unchanged)
coverage:
  records_dir: research/episodes/discovery/coverage
  absent_must_be_explicit: true
  gap_policy_notes: >-
    Preserves unknown; permits absence only over explicitly registered
    covered intervals. An empty or unavailable result remains unknown,
    not zero. No S1 source generates absence evidence under this config.
  absence_generating_families: []
  source_identity_keys:
    - source_family
    - authority
    - district
    - vehicle
    - endpoint

# D8 — physical thresholds (CHANGED for Option A)
# Option A enables per-class threshold detection from S2 gauge data
physical_thresholds:
  mode: heterogeneous_datum_thresholds
  class_thresholds:
    - class: LWRP_breach
      description: "Stage below LWRP at free-flowing Mississippi gauges"
      applies_to_gauges: ["07010000", "07022000", "07032000", "07289000", "07374000", "07374510"]
    - class: pool_minimum_breach
      description: "Stage below pool minimum at pooled-reach gauges"
      applies_to_gauges: ["03611500", "05586100", "05558300", "05331000", "14144700"]

# D9 — event windows (unchanged)
event_windows:
  pre_event_horizon: "4 weeks"
  reference_horizon: "prior-year same calendar weeks"
  response_horizon: "{1, 2, 4, 8, 13, 26} weeks"
  mapping_disposition: "strictly-after registered-grid; no fill/imputation"

# D10 — calibration set (unchanged)
calibration_set:
  count: 3
  selection_rule: >-
    Select the first three candidates in frozen D5 deterministic ordering
    (lowest deterministic CAND IDs after the complete candidate universe
    is minted). Fail closed if fewer than 3 candidates exist.

# D11 — concurrent shocks (unchanged)
concurrent_shocks:
  shock_types:
    - "drought (crop)"
    - "macro (rates/USD)"
    - "competing-origin (Brazil/Argentina)"
    - other
  sweep_rule: >-
    Every candidate receives the same mechanical sweep across every
    preregistered concurrent-shock class. Absence only under registered
    coverage, otherwise UNKNOWN. Never add classes from memory.

# D13 — analysis anchor grid (unchanged)
analysis_anchor_grid:
  frequency: weekly
  weekday_or_calendar_convention: Friday
  cutoff_time: "23:59"
  timezone: UTC
  holiday_treatment: rollback
  missing_anchor_handling: drop
  target_date_mapping: strictly-after
