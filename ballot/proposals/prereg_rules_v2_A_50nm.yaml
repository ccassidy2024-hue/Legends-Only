# S2 Mechanics — Option A: Heterogeneous Datum Threshold Breach Detection
# S2 generates independent threshold-breach candidates when stage < threshold
# for each gauge. Requires per-gauge datum normalization.
s2_mechanics:
  mode: heterogeneous_datum_thresholds
  candidate_generation: independent_threshold_breach
  independent_threshold_candidates: true
  inclusion_rule: >-
    When observed stage at a registered gauge falls below the gauge-specific
    threshold (LWRP for free-flowing, pool_minimum for pooled reaches),
    S2 generates an independent candidate. Candidates are generated for
    each threshold breach event, distinct from S1/S3/S5 corroboration.
  notes: >-
    Option A produces independent candidates from threshold breach events.
    Requires heterogeneous datum handling (6 LWRP gauges + 5 pool-minimum gauges).
    Changes D8 semantics by adding threshold-based candidate generation.

