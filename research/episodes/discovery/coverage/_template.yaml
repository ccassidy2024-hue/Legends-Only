# Source-coverage + sweep-execution record template (N2).
#
# Copy to a real filename ONLY when recording a coverage/sweep census row.
# Do NOT store navigation-notice titles, summaries, or event content here.
# Do NOT invent endpoints or districts — leave null until verified.
#
# Axis A — archive existence: coverage_status, earliest_available, latest_available
# Axis B — sweep execution: sweep_status, records_matched, scope_start, scope_end
# Do NOT reinterpret earliest/latest_available as sweep scope.
#
# P5 / ADR-0005 zero-semantics (comments only — no new keys):
# - Multiple interval-scoped rows per source are permitted.
# - Known gaps are explicit absent/unknown interval rows (not prose in notes).
#   For an affirmatively known gap, the absent/unknown coverage row must carry
#   explicit scope_start and scope_end identifying the gap interval.
# - Covered exposure = enumerated scopes minus declared known gaps.
# - records_matched: 0 applies to accessible records actually enumerated over
#   the row / net covered scope; it is not proof of real-world event absence.
# - Endpoint reachability does not prove archive retention completeness.
# - Supplementary sources (e.g. current LNM classification) do not create
#   absence exposure / swept-zero claims.

schema_version: "0.2"
record_kind: source_coverage

source_family: null          # e.g. S1 — only when the sweep family is registered
authority: null              # e.g. USACE — only when known
district: null               # district / office name — do not invent
vehicle: null                # publication vehicle name — do not invent
endpoint: null               # archive URL or locator — do not invent

# Archive history bounds (what the archive appears to contain)
earliest_available: null     # YYYY-MM-DD — do not use as sweep scope
latest_available: null       # YYYY-MM-DD — do not use as sweep scope

retrieved_on: null           # YYYY-MM-DD when the coverage/sweep check was performed

# Axis A
coverage_status: null        # present (= covered) | absent | unknown — never silent

# Axis B
sweep_status: null           # not_attempted | attempted_failed | enumerated
records_matched: null        # int only when enumerated; else null (0 = genuine swept-zero)
scope_start: null            # YYYY-MM-DD — required when enumerated
scope_end: null              # YYYY-MM-DD — required when enumerated

notes: null                  # coverage/sweep logistics only; no event narratives

# Forbidden (enforced by validator):
# event_name, episode_id, market_*, price_*, outcome_*, severity_class, etc.
