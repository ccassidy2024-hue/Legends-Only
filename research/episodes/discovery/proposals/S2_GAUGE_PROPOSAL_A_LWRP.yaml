# S2 Navigation Gauge Proposal - Variant A (LWRP Datum Mode)
#
# ============================================================================
# STATUS: NON_EXECUTABLE_AS_DEFINED
# ============================================================================
#
# Variant A is NOT executable for the frozen 10-gauge universe because LWRP
# (Low Water Reference Plane) is definitionally not applicable to 4 gauges
# that are in pooled or backwater-affected hydraulic regimes.
#
# LWRP Definition: "97% exceedance discharge water surface profile for
# FREE-FLOWING river reaches" — USACE Engineering Manual 1110-2-1003
#
# LWRP does not exist and cannot be defined for:
# - Pooled/dam-controlled river reaches (use "Flat Pool Elevation" or "LOL")
# - Backwater-affected reaches (no stable flow-stage relationship)
# - Tidal reaches (use MLLW or other tidal datum)
#
# This artifact preserved for audit purposes. Do NOT use digest as
# authorization target.
#
# ============================================================================

schema_version: "1.0"
proposal_id: S2_GAUGE_PROPOSAL_A_LWRP
proposal_date: "2026-08-27"
interpretation: LWRP_AS_OFFICIAL_DATUM
status: NON_EXECUTABLE_AS_DEFINED

executability:
  executable: false
  gauges_with_lwrp: 6
  gauges_without_lwrp: 4
  blocking_reason: >-
    LWRP (Low Water Reference Plane) is a hydraulic datum defined as the 97%
    exceedance discharge water surface profile. It exists ONLY for free-flowing
    river reaches. Four gauges (Ohio at Cairo/Metropolis, Illinois at Valley
    City/Henry) are in pooled or backwater-affected reaches where LWRP is
    definitionally not applicable. No amount of research can produce an LWRP
    for these gauges because the concept does not apply to their hydraulic
    regime.

