# S2 Navigation Gauge Proposal - Variant A (LWRP Datum Mode)
#
# Status: NON-EXECUTABLE PROPOSAL VARIANT (awaiting A+B ratification)
# Interpretation: §J S2 "programmatic threshold breach detection" satisfied via
#   official USACE Low Water Reference Plane (LWRP) as breach datum.
#
# Row count: 10 (NOT 11)
# Missing basins: Upper Mississippi (locked/pooled structure differs),
#   Columbia-Snake (requires separate PNW derivation not yet performed)
#
# If A+B requires Upper Mississippi or Columbia-Snake gauges, proposal must be
# extended with same methodology before ratification.

schema_version: "1.0"
proposal_id: S2_GAUGE_PROPOSAL_A_LWRP
proposal_date: "2026-08-26"
interpretation: LWRP_AS_OFFICIAL_DATUM
d8_compatibility: true
d8_mode: binding_operational_restriction_only

row_count: 10
claimed_row_count_discrepancy:
  claimed: 11
  actual: 10
  reason: >-
    Only 10 gauges derivable from D2 basin scope + USGS NWIS + USACE cooperation
    using mechanical criteria. Upper Mississippi basin (locked/pooled) requires
    structurally different gauge selection. Columbia-Snake basin requires
    separate PNW derivation not yet performed. No official/mechanical support
    exists for 11th row.

