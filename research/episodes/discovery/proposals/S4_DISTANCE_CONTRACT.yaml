# S4 distance contract — 100 NM preserved; mixed Haversine/WGS84 wording unmixed.
# Track geometry and geodesic algorithm remain exposed where not mechanical.

schema_version: "1.0"
proposal_id: S4_DISTANCE_CONTRACT
proposal_date: "2026-08-27"
packet_status: PR42_S4_CORRECTION_BLOCKED

proximity_radius_nm: 100
preserved:
  proximity_radius_nm: 100
  source: A+B approval S4_RADIUS=100_NM at PR42 head 840d989; radius not reopened

nautical_mile_m: 1852
nautical_mile_authority: >-
  International nautical mile, exactly 1852 metres (First International
  Extraordinary Hydrographic Conference, Monaco, 1929; SI coherent use).
radius_m: 185200
boundary_inequality: "<="
boundary_predicate: "distance_m <= 185200"
boundary_reading: >-
  "Within 100 NM" is inclusive. A storm position or track segment at exact
  equality is in-sample.

# Mixed PR42 wording "Haversine formula on WGS84 ellipsoid" is not one convention.
# Haversine is spherical. WGS84 geodesic is ellipsoidal (Vincenty/Karney).
# NHC HURDAT2 format does not mandate a unique Earth model for user distances.
geodesic_mechanical: false
geodesic_options:
  HAVERSINE_IUGG_MEAN:
    algorithm: haversine_sphere
    formula: >-
      d = 2 * R * arcsin(sqrt(sin^2(delta_phi/2) + cos(phi1)*cos(phi2)*sin^2(delta_lambda/2)))
      with phi, lambda in radians, d and R in metres.
    earth_radius_m: 6371008.8
    earth_radius_authority: >-
      IUGG mean Earth radius (Moritz 1980, Geodetic Reference System 1980).
    not: WGS84 ellipsoidal geodesic
  WGS84_KARNEY:
    algorithm: karney_geographiclib_inverse
    ellipsoid: WGS84
    semi_major_axis_m: 6378137.0
    flattening: "1/298.257223563"
    earth_radius_m: null
    authority: >-
      WGS84 defining constants; inverse geodesic per Karney 2013
      (GeographicLib). Distance is ellipsoid s12 in metres, then compared
      to 185200.
    not: haversine

hurdat2_treatment:
  authority: "NHC HURDAT2 Atlantic format (Landsea / NHC format note)"
  format_url: https://www.nhc.noaa.gov/data/hurdat/
  format_doc: https://www.aoml.noaa.gov/hrd/hurdat/hurdat2-format.pdf
  files:
    atlantic_retained_from_pr42: >-
      https://www.nhc.noaa.gov/data/hurdat/hurdat2-1851-2024-040425.txt
    pacific_ne_nc: >-
      Required iff the ratified facility census includes columbia_snake
      facilities. Not silently added in this packet.
  positions_used: >-
    Every HURDAT2 detail (data) line with a parseable latitude and longitude,
    including non-synoptic times (landfall L and other ATCF identifiers).
    Header lines are not positions.
  coordinate_parse: >-
    Latitude like 29.1N / 16.5N and longitude like 90.2W / 78.9W as published.
    North and East positive; South and West negative. Tenths of a degree as
    published; do not add precision.
  missing_positions: >-
    If latitude or longitude is missing or unparseable, skip that detail
    row. Do not invent a position. Do not interpolate across a skipped row.
  duplicate_positions: >-
    Exact duplicate tuples (storm_id, datetime_utc, lat, lon) collapse to
    one. Distinct coordinates at the same timestamp are both kept (both are
    published best-track positions).
  unused_fields: >-
    Wind radii and radius of maximum wind are storm-size fields in nautical
    miles. They are not the track-center-to-facility distance.
  interpolation_mechanical: false
  interpolation_changes_membership: true
  interpolation_note: >-
    Six-hour synoptic spacing can skip a closer approach between published
    points. Point-only vs consecutive-segment distance can change whether
    min distance is <= 185200 m.

exposed_fields:
  - field_id: S4_GEODESIC
    options: [HAVERSINE_IUGG_MEAN, WGS84_KARNEY]
    why_exposed: >-
      PR42 mixed Haversine and WGS84 ellipsoid. NHC HURDAT2 does not name
      one reproducible user-distance algorithm. Sphere vs ellipsoid can
      change membership near the 100 NM boundary (order 0.1 NM).
  - field_id: S4_TRACK_GEOMETRY
    options: [POINT_ONLY, GREAT_CIRCLE_OR_GEODESIC_SEGMENT]
    why_exposed: >-
      Not canonically settled. POINT_ONLY uses published HURDAT2 positions
      only. SEGMENT uses minimum distance to the geodesic (or sphere great
      circle, matching S4_GEODESIC) between consecutive chronological
      positions of the same storm, omitting any segment that would cross a
      skipped missing position. This can change sample membership.

marker: S4_DISTANCE_CONTRACT_100NM_EXPOSED_GEOMETRY
