  query_grain: UPPER(COMMODITIES) LIKE '%GRAIN%' OR UPPER(PURPOSE) LIKE '%GRAIN%'
  query_supp: WHEAT/CORN/SOY/RICE/BARLEY/SORGHUM/OATS in COMMODITIES or PURPOSE
  coverage_limitations:
  - Layer is a dock/navigation-unit inventory, not an FGIS export-elevator census.
  - COMMODITIES/PURPOSE text is not a closed grain-code field; token match can miss or overinclude.
  - FAC_TYPE includes Milepoint/Open Water/Junction/Fleeting Area/Anchorage which are excluded from facility
    rows.
  - No claim that every grain-handling facility in D2 is present.
