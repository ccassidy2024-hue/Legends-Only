    fields_used: [NAV_UNIT_ID, NAV_UNIT_NAME, FAC_TYPE, LATITUDE, LONGITUDE, WTWY, WTWY_NAME, PURPOSE, COMMODITIES, DATA_RECORD_STATUS]
  coverage_limitations:
  - Official snapshot of navigation facilities, not an FGIS export-elevator census.
  - COMMODITIES/PURPOSE are free-text; word-boundary grain tokens can overinclude general-cargo docks that list wheat/corn among many commodities.
  - FAC_TYPE includes Milepoint/Open Water/Junction/Fleeting Area/Anchorage/Lock which are excluded from S4 facility rows.
  - Completeness is not claimed beyond this snapshot plus the frozen live-D2 waterway map.
