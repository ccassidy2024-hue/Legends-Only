    executable: false
    gauges_with_lwrp: 6
    gauges_without_lwrp: 4
    reason: >-
      LWRP (Low Water Reference Plane) is a hydraulic datum defined as the 97%
      exceedance discharge water surface profile. It exists ONLY for free-flowing
      river reaches. Four gauges (7-10) are in pooled or backwater-affected reaches
      where LWRP is definitionally not applicable. No amount of research can produce
      an LWRP for these gauges because the concept does not apply to their hydraulic
      regime.

  variant_b_summary:
    executable: true
    candidate_generation: >-
      S2 does NOT generate independent candidates from stage readings. Under
      D8 mode=binding_operational_restriction_only, S2 gauge readings serve only
      to corroborate S1/S3 documented binding operational restrictions. A stage
      reading alone, regardless of value, does not trigger an S2 candidate.
    d8_interpretation: >-
      §J S2 "programmatic threshold breach detection" is satisfied by detecting
      when S1/S3 operational restrictions reference specific gauges. The
      "threshold" is the documented operational restriction itself, not a
      numeric stage value. This is consistent with D8 mode=binding_operational_
      restriction_only and class_thresholds=[].

# ============================================================================
# DECISION B: S4 RADIUS
# ============================================================================

decision_b_s4_radius:
  description: "S4 NHC storm proximity radius for export node triggering"
  
  options:
    50_NM:
      radius_nm: 50
      interpretation: "Conservative — direct landfalls only"
      
    100_NM:
      radius_nm: 100
      interpretation: "Standard — includes near-miss disruptions"

  distance_convention:
    unit: "nautical miles"
    geodesic: "great-circle distance"
    calculation: >-
      Haversine formula on WGS84 ellipsoid between storm center position
      (lat/lon from HURDAT2 best track) and node coordinates.
    storm_position_source: "NHC HURDAT2 best track database"
    storm_position_url: "https://www.nhc.noaa.gov/data/hurdat/"
    
  variant_difference: >-
    50nm and 100nm proposal artifacts are byte-identical except for:
    (1) proximity_radius_nm value, (2) proximity_radius_interpretation text,
    (3) trigger_condition text, (4) proposal_id, (5) marker. All 10 node
    rows are identical between variants.

