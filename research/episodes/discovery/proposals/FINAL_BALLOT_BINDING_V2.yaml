# ============================================================================
# FUTURE B-RED ACCEPTANCE CONTRACT
# ============================================================================

b_red_acceptance_contract:
  description: >-
    After v2 authorization, these tests must pass for any changes to
    N3/authorization guard files.
    
  guard_files_expected_to_change:
    - path: "config/discovery/prereg_rules.yaml"
      change: "Add S2 gauge registry, S4 node registry, S3/S5/S6/S7/S8 source entries"
    - path: "config/discovery/prereg_ratification_manifest.yaml"
      change: "Update interpretation_digests with new adapter files, update prereg_config_digest"
      
  guard_files_unchanged:
    - path: "src/grainsys/discovery/governance.py"
      reason: "N3 authorization logic unchanged; only config/manifest updated"
      
  acceptance_tests:
    v1_historical_verification:
      test: "assert_sweep_authorized() passes on v1 tag descendant with v1 config"
      expected: PASS
      
    v2_exact_tag_digest_authorization:
      test: "assert_sweep_authorized() passes on v2 tag descendant with exact v2 config digest"
      expected: PASS
      
    fail_closed_dirty_tree:
      test: "assert_sweep_authorized() fails if working tree differs from HEAD blob"
      expected: FAIL_CLOSED
      
    fail_closed_wrong_digest:
      test: "assert_sweep_authorized() fails if live config digest != ratified digest"
      expected: FAIL_CLOSED
      
    fail_closed_wrong_tag:
      test: "assert_sweep_authorized() fails if HEAD does not descend from required tag"
      expected: FAIL_CLOSED
      
    fail_closed_unbound_path:
      test: "assert_sweep_authorized() fails if interpretation path not in manifest"
      expected: FAIL_CLOSED

