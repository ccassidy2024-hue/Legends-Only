# ============================================================================
# DECISION A: S2 MECHANICS
# ============================================================================

decision_a_s2_mechanics:
  description: "S2 sweep interpretation under §J and D8"
  
  canonical_text_j_s2: >-
    "S2 | USGS/AHPS gauges at pre-registered navigation gauges | 
    Programmatic threshold breach detection over the full period"
    — EPISODE_PROTOCOL.md line 997
    
  canonical_text_d8: >-
    "physical_thresholds:
      mode: binding_operational_restriction_only
      class_thresholds: []"
    — config/discovery/prereg_rules.yaml lines 145-147

  options:
    REOPEN_SCIENCE:
      description: >-
        Reopen science to define a new full-universe threshold rule that covers
        all 10 gauges with appropriate datums for each hydraulic regime.
      consequence: >-
        S2 execution blocked until a new exact threshold rule is ratified.
        Another A+B ratification required before S2 can generate candidates.
      executable_now: false
      
    USE_B_OPERATIONAL_RESTRICTION_ONLY:
      description: >-
        S2 triggers only when S1/S3 documents an operational restriction at
        a registered gauge. S2 does not generate independent candidates from
        raw stage data; it corroborates S1/S3 binding operational restrictions.
      consequence: >-
        S2 candidate generation: NONE independent. Gauge readings corroborate
        S1/S3 evidence only. No numeric stage threshold applied. Under D8
        mode=binding_operational_restriction_only, only documented binding
        operational restrictions (closure, draft restriction, etc.) qualify.
      executable_now: true

