# ============================================================================
# POST-VOTE PERSISTENCE SEQUENCE
# ============================================================================

post_vote_sequence:
  if_b_selected:
    - step: 1
      action: "Materialize selected full-config (B50 or B100) into config/discovery/prereg_rules.yaml"
    - step: 2
      action: "Build new ratification manifest with updated digests"
    - step: 3
      action: "Commit to main branch"
    - step: 4
      action: "Create prereg-rules-v2 tag on that commit"
    - step: 5
      action: "S2/S3/S4/S5/S6/S7/S8 sweeps authorized on v2 descendants"
      
  if_reopen_science_selected:
    - step: 1
      action: "S2 execution remains blocked"
    - step: 2
      action: "New A+B ratification required to define full-universe threshold rule"
    - step: 3
      action: "S4/S3/S5/S6/S7/S8 can proceed to v2 if S2 is decoupled"
      note: "Requires decision on whether to decouple S2 from v2 or wait"

