# ============================================================================
# DECISION C: V2 GOVERNANCE AMENDMENT APPROVAL
# ============================================================================

decision_c_v2_governance:
  description: "Approve exact v2 governance amendment bound to selected full-config digest"
  
  v2_manifest_binding:
    manifest_path: "config/discovery/prereg_ratification_manifest.yaml"
    content_update: >-
      New manifest will include interpretation_digests for S3/S5/S6/S7/S8
      adapter files plus updated prereg_config_digest for the selected
      full-config (B50 or B100).
      
  prereg_rules_v2_tag:
    tag_name: "prereg-rules-v2"
    target_rule: >-
      Tag MUST point to the exact commit containing the ratified full-config
      with the selected S2 (B) and S4 (50nm or 100nm) choices materialized
      in config/discovery/prereg_rules.yaml.
      
  v1_historical_verification:
    behavior: >-
      prereg-rules-v1 tag at a74e3fb925b80f308407cc2f1508d6aecd868326 remains
      historically valid for any commit that descends from it with unchanged
      v1-era prereg_rules.yaml. v1 ratification is not invalidated by v2.
      
  supersession_behavior: >-
    v2 authorization supersedes v1 for sweeps that require the v2-added
    source families (S2-S8). S1 sweeps remain valid under v1 authorization.
    v2 execution requires HEAD to descend from v2 tag with matching digests.

