# FULL_CONFIG_B50 — Deterministic Full Configuration for B + 50nm Authorization
#
# This file represents the exact byte content that would be materialized into
# config/discovery/prereg_rules.yaml if the ballot selects:
# - S2: B (Operational Restriction Only)
# - S4: 50 nm proximity radius
#
# Status: EXECUTABLE AUTHORIZATION TARGET
# Marker: FULL_CONFIG_B50_DETERMINISTIC

schema_version: "0.3"

governing_adr: docs/decisions/0002-episode-preregistration.md

# D1 — global sample period (ratified 2026-08-24)
sample_period:
  sample_start: "2010-01-01"
  sample_end: "2024-12-31"

# D2 — corridor / basin scope
corridors:
  navigation_basins:
    - lower_mississippi
    - middle_mississippi
    - upper_mississippi
    - ohio
    - illinois
    - columbia_snake

