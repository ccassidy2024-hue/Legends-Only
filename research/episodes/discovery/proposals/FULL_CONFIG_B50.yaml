# D9 — event window / horizon set (ratified)
event_windows:
  pre_event_horizon: "4 weeks"
  reference_horizon: "prior-year same calendar weeks"
  response_horizon: "{1, 2, 4, 8, 13, 26} weeks"
  mapping_disposition: "strictly-after registered-grid; no fill/imputation"

# D10 — three-candidate calibration set (ratified)
calibration_set:
  count: 3
  selection_rule: >-
    Select the first three candidates in frozen D5 deterministic ordering
    (lowest deterministic CAND IDs after the complete candidate universe
    is minted). Fail closed if fewer than 3 candidates exist.

# D11 — concurrent-shock types (ratified)
concurrent_shocks:
  shock_types:
    - "drought (crop)"
    - "macro (rates/USD)"
    - "competing-origin (Brazil/Argentina)"
    - other
  sweep_rule: >-
    Every candidate receives the same mechanical sweep across every
    preregistered concurrent-shock class. Absence only under registered
    coverage, otherwise UNKNOWN. Never add classes from memory.

# D13 — analysis-anchor grid (ratified)
analysis_anchor_grid:
  frequency: weekly
  weekday_or_calendar_convention: Friday
  cutoff_time: "23:59"
  timezone: UTC
  holiday_treatment: rollback
  missing_anchor_handling: drop
  target_date_mapping: strictly-after

marker: "FULL_CONFIG_B50_DETERMINISTIC_v2"
