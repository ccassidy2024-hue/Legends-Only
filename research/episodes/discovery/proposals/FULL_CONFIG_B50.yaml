  # S3 - USCG MSIB (proposed v2 addition)
  - sweep_id: S3
    authority: "U.S. Coast Guard"
    vehicle: "Navigation Center MSIB national and district bulletins"
    endpoint: "https://www.navcen.uscg.gov/msib"
    districts:
      - "D8"    # Eighth District (Gulf/Lower Mississippi)
      - "D13"   # Thirteenth District (Pacific Northwest)
      - "D9"    # Ninth District (Great Lakes)
    positive_evidence_only: true

  # S4 - NHC HURDAT2 (proposed v2 addition)
  - sweep_id: S4
    authority: "National Hurricane Center / NOAA"
    vehicle: "HURDAT2 Atlantic best track archive"
    endpoint: "https://www.nhc.noaa.gov/data/hurdat/hurdat2-1851-2024-040425.txt"
    proximity_radius_nm: 50
    positive_evidence_only: true

  # S5 - AMS Grain Transportation Report (proposed v2 addition)
  - sweep_id: S5
    authority: "USDA Agricultural Marketing Service"
    vehicle: "Grain Transportation Report weekly releases"
    endpoint: "https://www.ams.usda.gov/services/transportation-analysis/gtr"
    positive_evidence_only: true

  # S6 - USACE LPMS (proposed v2 addition)
  - sweep_id: S6
    authority: "U.S. Army Corps of Engineers"
    vehicle: "Lock Performance Monitoring System"
    endpoint: "https://corpslocks.usace.army.mil/"
    positive_evidence_only: true

  # S7 - STB Dockets (proposed v2 addition)
  - sweep_id: S7
    authority: "Surface Transportation Board"
    vehicle: "STB docket filings and service events"
    endpoint: "https://www.stb.gov/"
    docket_prefixes:
      - "EP"    # Exemption Proceedings
      - "EX"    # Ex Parte proceedings
      - "STB"   # General STB proceedings
    positive_evidence_only: true

  # S8 - Port Authority Notices (proposed v2 addition)
  - sweep_id: S8
    authority: "Port Authorities"
    vehicle: "Official port terminal operational notices"
    nodes: "S4 node registry"
    positive_evidence_only: true

# D4 — keyword policy (ratified)
keyword_policy:
  terms:
    - closure
    - restriction
    - "draft restriction"
    - lockage
    - "high water"
    - "low water"
    - dredging
    - outage
    - grounding
    - allision
    - breach
  match: whole_word
  case_sensitive: false
  fields:
    - full_text

# D5 — candidate table + deterministic ID minting (ratified)
candidates:
  table_path: research/episodes/discovery/candidates/candidates.csv
  id_prefix: CAND
  ordering_keys:
    - sweep_id
    - source_reference
  stable_id_key: null

# D6 — pre-episode raw capture roots (ratified)
capture:
  sweeps_subdir: sweeps
  rehome_policy: candidate_keyed_no_move

# D7 — coverage gap policy (ratified)
coverage:
  records_dir: research/episodes/discovery/coverage
  absent_must_be_explicit: true
  gap_policy_notes: >-
    Preserves unknown; permits absence only over explicitly registered
    covered intervals. An empty or unavailable result remains unknown,
    not zero. No S1 source generates absence evidence under this config.
  absence_generating_families: []
  source_identity_keys:
    - source_family
    - authority
    - district
    - vehicle
    - endpoint

# D8 — physical thresholds (ratified; B mode binding)
physical_thresholds:
  mode: binding_operational_restriction_only
  class_thresholds: []

