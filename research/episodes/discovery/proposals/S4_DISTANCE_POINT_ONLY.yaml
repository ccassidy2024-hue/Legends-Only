schema_version: '1.0'
proposal_id: S4_DISTANCE_POINT_ONLY
recommended: true
track_geometry: POINT_ONLY
rule: Minimum Haversine distance from facility to any published HURDAT2 detail-line position with parseable
  lat/lon, including non-synoptic (L) times. No interpolation.
mechanical_from_pr42: true
pr42_text: storm center position (lat/lon from HURDAT2 best track)
proximity_radius_nm: 100
nautical_mile_m: 1852
radius_m: 185200
boundary_inequality: <=
boundary_predicate: distance_m <= 185200
geodesic:
  algorithm: haversine_sphere
  mechanical_from_pr42: true
  formula: d = 2*R*asin(sqrt(sin^2(dphi/2)+cos(phi1)*cos(phi2)*sin^2(dlon/2)))
  earth_radius_m: 6366707.019493707
  earth_radius_rule: R = 1852 * 10800 / pi  (sphere on which 1 arc-minute of great circle = 1 international
    nautical mile)
  rejected_mixed_wording: Haversine on WGS84 ellipsoid is internally contradictory; keep approved Haversine,
    drop ellipsoid
