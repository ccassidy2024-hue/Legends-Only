# D4 — keyword policy (ratified)
keyword_policy:
  terms:
    - closure
    - restriction
    - "draft restriction"
    - lockage
    - "high water"
    - "low water"
    - dredging
    - outage
    - grounding
    - allision
    - breach
  match: whole_word
  case_sensitive: false
  fields:
    - full_text

# D5 — candidate table + deterministic ID minting (ratified)
candidates:
  table_path: research/episodes/discovery/candidates/candidates.csv
  id_prefix: CAND
  ordering_keys:
    - sweep_id
    - source_reference
  stable_id_key: null

# D6 — pre-episode raw capture roots (ratified)
capture:
  sweeps_subdir: sweeps
  rehome_policy: candidate_keyed_no_move

# D7 — coverage gap policy (ratified)
coverage:
  records_dir: research/episodes/discovery/coverage
  absent_must_be_explicit: true
  gap_policy_notes: >-
    Preserves unknown; permits absence only over explicitly registered
    covered intervals. An empty or unavailable result remains unknown,
    not zero. No S1 source generates absence evidence under this config.
  absence_generating_families: []
  source_identity_keys:
    - source_family
    - authority
    - district
    - vehicle
    - endpoint

# D8 — physical thresholds (ratified; B mode binding)
physical_thresholds:
  mode: binding_operational_restriction_only
  class_thresholds: []

