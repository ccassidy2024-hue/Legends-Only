      interpretation: "Operational restriction only (S2 corroborates S1/S3)"
      file_path: research/episodes/discovery/proposals/S2_GAUGE_PROPOSAL_B_OPERATIONAL.yaml
      sha256_digest: 20c269d8b00ba8d058b75409480d67eaea7ef63c15b56cb5d98c297f34cc9a64
      gauge_count: 10
      d8_compatible: true

  human_choice_required:
