  deficiency_reason: >-
    Only 10 gauges derivable from D2 basin scope using USGS NWIS + USACE
    cooperation methodology. Missing: Upper Mississippi (locked/pooled
    structure requires different selection criteria), Columbia-Snake (requires
    separate PNW derivation not yet performed). No official/mechanical support
    exists for 11th row.

  variants:
    - variant_id: S2_GAUGE_PROPOSAL_A_LWRP
      interpretation: "LWRP as official USACE datum for breach detection"
