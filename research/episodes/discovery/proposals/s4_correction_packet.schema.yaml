# Schema for the PR42 S4 binding-correction packet.
# Non-executable. Does not authorize sweeps or production persistence.

schema_version: "1.0"
schema_id: S4_CORRECTION_PACKET_SCHEMA
packet_status_vocab:
  - PR42_S4_CORRECTION_BLOCKED
  - PR42_S4_CORRECTION_PACKET_READY

required_packet_files:
