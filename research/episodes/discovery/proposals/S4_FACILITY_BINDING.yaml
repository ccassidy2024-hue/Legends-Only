# ============================================================================
# Irreducible selector (single smallest batched re-ratification field)
# ============================================================================

irreducible_selector:
  field_id: S4_NODE_CENSUS_SELECTOR
  why_irreducible: >-
    After applying object-class and live-D2 filters, more than one official
    census can still generate different finite facility sets, and none is
    already bound with coordinates.
  humans_must_bind:
    official_census_source: which named official product enumerates the facilities
    vintage: exact publication/extract date or hash of the census bytes
    transfer_scope: >-
      export elevators only, or export plus inland grain transfer terminals
      on live D2 waterways
    coordinate_product: which official lat/lon product and match rule
  not_silently_chosen: true

marker: S4_FACILITY_BINDING_FAIL_CLOSED_EMPTY_DEFAULT
