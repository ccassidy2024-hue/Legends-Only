# S4 Export/Transfer Node Proposal - Variant 50NM
#
# Status: NON-EXECUTABLE PROPOSAL VARIANT (awaiting A+B ratification)
# Proximity radius: 50 nautical miles (conservative)
#
# Row count: 10 (NOT 14)
# Derivation: USDA FGIS official export port regions only
# Excluded: Nodes lacking independent FGIS export facility registration
#
# If A+B requires additional nodes, each must have official FGIS or equivalent
# Tier 1 source documentation before inclusion.

schema_version: "1.0"
proposal_id: S4_NODE_PROPOSAL_50NM
proposal_date: "2026-08-26"
proximity_radius_nm: 50
proximity_radius_interpretation: >-
  Conservative radius capturing direct landfalls only. Storm center must pass
  within 50 nm of node coordinates to trigger S4 candidate.

row_count: 10
claimed_row_count_discrepancy:
  claimed: 14
  actual: 10
  reason: >-
    Only 10 nodes derivable from USDA FGIS official export port region
    definitions. Corporate-only evidence (e.g., TEMCO Kalama) does not meet
    Tier 1 official source requirements. Additional nodes would require either
    (a) independent FGIS registration, or (b) A+B ratification of alternative
    official source criteria. No official/mechanical support exists for 14 rows.

fgis_port_regions_reference:
  MISSISSIPPI_RIVER: "Export port locations on the Mississippi River in Louisiana"
  EAST_GULF: "East of Mississippi River in Gulf coastal areas"
  NORTH_TEXAS: "Houston and points north, plus west of Mississippi River in Louisiana"
  SOUTH_TEXAS: "Geographically south of Houston, Texas on Gulf of Mexico"
  COLUMBIA_RIVER: "Along Columbia River system in Pacific Northwest"
  PUGET_SOUND: "Waterways of Puget Sound in Washington"

nodes:
  # Gulf Export Nodes (FGIS Mississippi River + Texas Regions)
  - node_id: "GULF-01"
    name: "South Louisiana (general)"
    latitude: 29.9500
    longitude: -90.0500
    fgis_port_region: MISSISSIPPI_RIVER
    official_source: "FGIS port region centroid"

  - node_id: "GULF-02"
