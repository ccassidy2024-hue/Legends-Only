excluded_nodes:
  - name: "TEMCO Kalama"
    reason: >-
      No independent FGIS export facility registration found. Corporate-only
      evidence does not meet Tier 1 source requirements. Hurricane proximity
      to Kalama area captured via Port of Longview (PNW-03).
  - name: "East Gulf facilities"
    reason: >-
      EAST_GULF FGIS region exists but no specific grain export facilities
      identified with official coordinates meeting Tier 1 requirements.
  - name: "Additional Texas terminals"
    reason: >-
      Multiple terminals exist in NORTH_TEXAS/SOUTH_TEXAS regions but
      specific facility coordinates require individual verification against
      FGIS registration or equivalent official source.

execution_semantics:
  trigger_condition: "NHC storm track passes within 50 nm of node coordinates"
  evidence_type: "Independent S4 candidate for each qualifying landfall"
  positive_evidence_only: true
  absence_generating: false
  nhc_data_source: "HURDAT2"

verification_urls:
  fgis_regions: "https://fgisonline.ams.usda.gov/F_DEC/exportRegionDefinitionTables0801.pdf"
  fgis_data: "https://www.ams.usda.gov/resources/fgis-data-and-statistics"
  nhc_hurdat2: "https://www.nhc.noaa.gov/data/hurdat/"

marker: "S4_PROPOSAL_50NM_10_ROWS"
