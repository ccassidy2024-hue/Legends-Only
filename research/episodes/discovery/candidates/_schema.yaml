# Candidate-hit schema (scaffolding only).
#
# No real candidate rows are stored in this repository until Phase 0
# preregistration is committed, ratified (N3), and a live sweep is authorized.
# This file documents required columns for a future candidates table.

schema_version: "0.2"
record_kind: candidate_hit

# Required fields after a registered sweep produces a hit:
required_fields:
  - candidate_id          # minted under explicit ordering_keys only (N1)
  - sweep_id              # e.g. S1 — from registered config only
  - source_reference      # locator/ref string for the document (not episode content)
  - raw_capture_pointer   # path under pre-episode capture root (may be null until captured)
  - document_date         # document date if knowable from listing metadata without opening body
  - ordering_key          # deterministic sort key used at mint time (opaque string)

optional_fields:
  - stable_source_id      # source-native id when provided — dedup only; never invented
  - authority
  - district
  - vehicle
  - endpoint
  - retrieved_on
  - notes                 # logistics only
  - full_text             # D3/D4: local normalized extracted linked-document text
                          # NOT a source-native NTNI field; extracted at retrieval time
                          # from captured linked documents; null until retrieval completes
  # Future emitters should also stamp SweepProvenance fields (N3):
  # prereg_tag, prereg_config_digest, execution_commit_sha, governing_adr

# Explicitly forbidden columns (validator rejects):
forbidden_fields:
  - episode_id
  - event_name
  - market_outcomes_reviewed
  - market_outcome
  - price
  - futures
  - basis
  - freight_rate
  - severity_class
  - public_anchor
  - decision
  - accept
  - reject

# Live table path is configured in config/discovery/prereg_rules.yaml (D5).
# Until that file exists with non-empty ordering_keys and table_path, and N3
# ratification passes, live sweeps FAIL CLOSED.
