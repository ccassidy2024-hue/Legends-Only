[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grainsys"
version = "0.1.0"
description = "Mechanism-aware quantitative discovery engine for U.S. grain logistics (Legends-Only)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Legends-Only" }]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "statsmodels",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
