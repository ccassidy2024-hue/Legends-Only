# Legends-Only / grainsys project settings
# Paths are relative to the repository root unless absolute.

project:
  name: Legends-Only
  package: grainsys
  phase: m8_written_negative_result
  next_milestone: none_kill_closed

paths:
  catalog_series: catalog/series
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  episode_ledger: research/episodes/EPISODE_LEDGER.md
  outputs_tables: outputs/tables
  outputs_charts: outputs/charts
  outputs_reports: outputs/reports
  fixtures: tests/fixtures

data_policy:
  raw_immutable: true
  require_publication_timing: true
  invent_source_metadata: false
  observation_schema:
    - series_id
    - period_end
    - release_ts
    - value

research_policy:
  pairwise_screening_is_exploratory_only: true
  episode_identification_blind_to_market_outcomes: true
  prefer_local_projections_for_dynamics: true
  lag_convention: "lag=+k means X_t predicts Y_(t+k); X leads Y"
  separate_statements:
    - what_the_data_show
    - why_we_think_it_happens
    - what_we_expect_next
    - how_it_could_be_traded
