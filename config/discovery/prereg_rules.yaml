# config/discovery/prereg_rules.yaml
#
# LIVE CONFIGURATION — ratified A+B Phase 0 values.
# Persistence of durable Slack ratifications per Task C orchestration (2026-08-24).
#
# D12 is deliberately absent/unregistered per R-003.
# This file does NOT authorize a sweep by itself. N3 guards must pass:
# - governing ADR status accepted
# - tag prereg-rules-v1 exists with digest manifest
# - digests match
# - HEAD descends from tagged commit
# - working tree matches actual HEAD blobs byte-for-byte

schema_version: "0.2"

# N3 — governing ADR
governing_adr: docs/decisions/0002-episode-preregistration.md

# D1 — global sample period (ratified 2026-08-24)
sample_period:
  sample_start: "2010-01-01"
  sample_end: "2024-12-31"

# D2 — corridor / basin scope
# Eligible corridors derived from D2-EXACT-v1 profile (d2_waterborne.py).
# These are the waterborne basins covered by D3 S1 NTNI source districts.
corridors:
  navigation_basins:
    - lower_mississippi
    - middle_mississippi
    - upper_mississippi
    - ohio
    - illinois
    - columbia_snake

